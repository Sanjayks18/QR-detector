<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Attendance Scanner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #4CAF50;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }
    #scan-result {
      margin: 20px 0;
      min-height: 50px;
      padding: 15px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    #reader {
      width: 320px;
      height: 240px;
      margin: 0 auto 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    #photo-canvas-container {
      margin-top: 20px;
      text-align: center;
    }
    #photo-canvas-container canvas {
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 100%;
    }
    .nav-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }
    .admin-btn, .refresh-btn {
      padding: 12px 24px;
      background: linear-gradient(45deg, #4CAF50, #45a049);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      font-size: 14px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
    }
    .admin-btn:hover, .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(76, 175, 80, 0.6);
    }
    .status {
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      margin-top: 10px;
    }
    .success { background: #e8f5e8; color: #2e7d32; border: 2px solid #4caf50; }
    .error { background: #ffebee; color: #c62828; border: 2px solid #f44336; }
    .already { background: #e1f5fe; color: #0277bd; border: 2px solid #03a9f4; }
    .scanning { background: #fff3e0; color: #ef6c00; border: 2px solid #ff9800; }
  </style>
  
  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <!-- Admin Navigation Button -->
  <a href="/admin" class="admin-btn" style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
    📊 Admin Dashboard
  </a>

  <div class="container">
    <h1>📱 QR Attendance Scanner</h1>
    <p class="subtitle">Scan QR code to mark attendance</p>

    <!-- QR Scanner -->
    <div id="reader"></div>

    <!-- Scan Result Display -->
    <div id="scan-result" class="status"></div>

    <!-- Photo Capture Container -->
    <div id="photo-canvas-container"></div>

    <!-- Navigation Buttons -->
    <div class="nav-buttons">
      <a href="/admin" class="admin-btn">📊 View Admin Dashboard</a>
      <button class="refresh-btn" onclick="location.reload()">🔄 Refresh Scanner</button>
    </div>
  </div>

  <!-- Your existing app.js -->
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
